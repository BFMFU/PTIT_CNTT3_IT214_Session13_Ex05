plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ra.edu'
version = '0.0.1-SNAPSHOT'
description = 'Report-Service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.3")
}

dependencies {
    // WebFlux — Non-blocking reactive stack (thay thế webmvc)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Actuator — Phơi bày /actuator/metrics cho Grafana/Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Resilience4j — Spring Cloud starter (auto-config CircuitBreakerRegistry)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // Resilience4j Reactor — Cung cấp CircuitBreakerOperator cho Reactive streams
    implementation 'io.github.resilience4j:resilience4j-reactor'

    // Resilience4j Micrometer — Xuất CB metrics (state, calls, etc.) sang Micrometer
    implementation 'io.github.resilience4j:resilience4j-micrometer'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
